server {
	listen 80;
	server_name _;

	root /var/www/public;

	location /static/ {
		try_files $uri =404;
	}

	location / {
		proxy_pass http://app:5000;
		
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		
		proxy_buffering off;
	}
}
