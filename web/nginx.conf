server {
	listen 80;
	server_name _;

	root /var/www/html;

	# Directly serve ONLY static assets (images, CSS, JS, fonts, icons)
	location ~* \.(ico|png|jpg|jpeg|svg|css|js|gif|webp|woff|woff2|ttf|eot)$ {
		try_files /public$uri $uri =404;
		expires 7d;
	}

	# Forward ALL other requests (including HTML forms, EPL files, and POSTs) to Starman
	location / {
		proxy_pass http://app:5000;
		
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		
		proxy_buffering off;
	}
}
