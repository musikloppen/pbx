services:
  pbx:
    build: '.'
    container_name: pbx
    privileged: true
    ports:
      - 5060:5060/udp
      - 5160:5160/udp
      - 10000-10100:10000-10100/udp
    depends_on:
      - pbx-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: pbx
      MYSQL_USER: pbx
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      SIP_TRUNK_USERNAME: ${SIP_TRUNK_USERNAME}
      SIP_TRUNK_SECRET: ${SIP_TRUNK_SECRET}
      SIP_TRUNK_HOST: ${SIP_TRUNK_HOST}
      SIP_TRUNK_CALLER_ID: ${SIP_TRUNK_CALLER_ID}
      GATE_1_PHONE: ${GATE_1_PHONE}
      GATE_2_PHONE: ${GATE_2_PHONE}
      TZ: 'Europe/Copenhagen'
  pbx-db:
    image: mariadb:10.5
    container_name: pbx-db
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ./my.cnf:/etc/mysql/my.cnf
      - ./db_data:/var/lib/mysql:delegated
      - ./pbx.sql:/pbx.sql
      - ./pbx_setup.sh:/pbx_setup.sh
      - ./pbx_import.sh:/pbx_import.sh
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: pbx
      MYSQL_USER: pbx
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: 'Europe/Copenhagen'
