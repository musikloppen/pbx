services:
  # 1. Public Nginx Frontend (Entrypoint)
  web:
    build: ./web
    container_name: web
    hostname: web
    environment:
      TZ: "Europe/Copenhagen"
    ports:
      - "80:80"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sms-auth
    restart: always

  # 2. Perl SMSAuth Proxy & Authenticator
  sms-auth:
    build:
      context: ./sms-auth
      dockerfile: Dockerfile
    container_name: sms-auth
    hostname: sms-auth
    environment:
      NOTIFICATION_SMS_CODE_MESSAGE: "SMS Code: {sms_code}"
      DB_HOST: "pbx-db"
      DB_NAME: "pbx"
      DB_USER: "pbx"
      DB_PASS: "${MYSQL_PASSWORD}"
      UPSTREAM_BACKEND: "http://web-backend:5000"
      SMTP_HOST: "${SMTP_HOST}"
      TZ: "Europe/Copenhagen"
    depends_on:
      pbx-db:
        condition: service_healthy
      pbx:
        condition: service_started
      web-backend:
        condition: service_started
    restart: always

  # 3. Protected Backend Application Server (Internal - Handles UI & /api/unlock)
  web-backend:
    build:
      context: ./web-backend
      dockerfile: Dockerfile
    container_name: web-backend
    hostname: web-backend
    environment:
      ASTERISK_HOST: "pbx"
      ASTERISK_AMI_PORT: "5038"
      ASTERISK_AMI_USER: ${ASTERISK_AMI_USER}
      ASTERISK_AMI_PASS: ${ASTERISK_AMI_PASS}
      SIP_TRUNK_CALLER_ID: ${SIP_TRUNK_CALLER_ID}
      GATE_1_PHONE: ${GATE_1_PHONE}
      GATE_2_PHONE: ${GATE_2_PHONE}
      TZ: "Europe/Copenhagen"
    volumes:
      - ./web-backend/www:/var/www/html:ro
      - ./web-backend/app.psgi:/var/www/app.psgi:ro
    restart: always

  # 4. Asterisk PBX
  pbx:
    build:
      context: ./pbx
      dockerfile: Dockerfile
    container_name: pbx
    hostname: pbx
    privileged: true
    ports:
      - "5060:5060/udp"
      - "5160:5160/udp"
      - "10000-10100:10000-10100/udp"
    depends_on:
      - pbx-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "pbx"
      MYSQL_USER: "pbx"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      ASTERISK_AMI_USER: ${ASTERISK_AMI_USER}
      ASTERISK_AMI_PASS: ${ASTERISK_AMI_PASS}
      SIP_TRUNK_USERNAME: "${SIP_TRUNK_USERNAME}"
      SIP_TRUNK_SECRET: "${SIP_TRUNK_SECRET}"
      SIP_TRUNK_HOST: "${SIP_TRUNK_HOST}"
      SIP_TRUNK_CALLER_ID: "${SIP_TRUNK_CALLER_ID}"
      GATE_1_PHONE: "${GATE_1_PHONE}"
      GATE_2_PHONE: "${GATE_2_PHONE}"
      TZ: "Europe/Copenhagen"

  # 5. MariaDB Database
  pbx-db:
    image: mariadb:10.5
    container_name: pbx-db
    hostname: pbx-db
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ./pbx/my.cnf:/etc/mysql/my.cnf
      - ./db_data:/var/lib/mysql:delegated
      - ./pbx/pbx.sql:/pbx.sql
      - ./pbx/pbx_setup.sh:/pbx_setup.sh
      - ./pbx/pbx_import.sh:/pbx_import.sh
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "pbx"
      MYSQL_USER: "pbx"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      TZ: "Europe/Copenhagen"

volumes:
  db_data:
