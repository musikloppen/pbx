[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
; Global variables goes here

[incoming]
exten => _X.,1,Goto(s,1)

exten => s,1,Log(NOTICE, Incoming call from ${CALLERID(all)})
exten => s,n,Set(CALLERID(num)=${FILTER(0123456789,${CALLERID(num)})})
exten => s,n,System(/var/lib/asterisk/allowed_caller_id.pl "${CALLERID(num)}")
;exten => s,n,Log(NOTICE, Allowed Caller ID return: "${SYSTEMSTATUS}")
exten => s,n,GotoIf($["${SYSTEMSTATUS}" != "SUCCESS"]?ignore,1,1)
exten => s,n,Answer()
exten => s,n(menu),Background(custom/press_one_or_two)
exten => s,n,WaitExten()

; Extension 1:
exten => 1,1,Log(NOTICE, User pressed 1)
exten => 1,n,System(/var/lib/asterisk/log.pl "${CALLERID(num)}" "pressed 1")
exten => 1,n,System(cp /var/lib/asterisk/gate1.call /tmp/gate1.call && mv /tmp/gate1.call /var/spool/asterisk/outgoing/)
exten => 1,n,Playback(custom/gate1)
exten => 1,n,Hangup()

; Extension 2:
exten => 2,1,Log(NOTICE, User pressed 2)
exten => 2,n,System(/var/lib/asterisk/log.pl "${CALLERID(num)}" "pressed 2")
exten => 2,n,System(cp /var/lib/asterisk/gate2.call /tmp/gate2.call && mv /tmp/gate2.call /var/spool/asterisk/outgoing/)
exten => 2,n,Playback(custom/gate2)
exten => 2,n,Hangup()

exten => t,1,Log(NOTICE, Timed out)
exten => t,n,System(/var/lib/asterisk/log.pl "${CALLERID(num)}" "timed out")
exten => t,n,Goto(s,menu)

exten => h,1,System(/var/lib/asterisk/log.pl "${CALLERID(num)}" "hang up")

[ignore]
exten => 1,1,Log(NOTICE, Ignore caller)
exten => 1,n,Busy(10)
exten => 1,n,Hangup()

[myphones]
exten => 1000,1,Dial(SIP/1000)
exten => 1000,n,Hangup()

exten => 1001,1,Dial(SIP/1001)
exten => 1001,n,Hangup()

exten => 100,1,Answer()
exten => 100,n,ExecIf($["${ENV(DEBUG)}" = "1" | "${ENV(DEBUG)}" = "true" | "$DEBUG" = "1"]?Wait(2))
exten => 100,n,ExecIf($["${ENV(DEBUG)}" = "1" | "${ENV(DEBUG)}" = "true" | "$DEBUG" = "1"]?Hangup())
exten => 100,n,Dial(SIP/sip-trunk/$GATE_1_PHONE,60)
exten => 100,n,Hangup()

exten => 200,1,Answer()
exten => 200,n,ExecIf($["${ENV(DEBUG)}" = "1" | "${ENV(DEBUG)}" = "true" | "$DEBUG" = "1"]?Wait(2))
exten => 200,n,ExecIf($["${ENV(DEBUG)}" = "1" | "${ENV(DEBUG)}" = "true" | "$DEBUG" = "1"]?Hangup())
exten => 200,n,Dial(SIP/sip-trunk/$GATE_2_PHONE,60)
exten => 200,n,Hangup()

exten => 300,1,Answer()
exten => 300,n,Dial(SIP/sip-trunk/32578422,60)
exten => 300,n,Hangup()

exten => 400,1,Answer()
exten => 400,n,Dial(SIP/sip-trunk/91966654,60)
exten => 400,n,Hangup()

exten => 500,1,Answer()
exten => 500,n,Dial(SIP/1000,60)
exten => 500,n,Hangup()

; --- Dedicated Web Gate Openers ---
; Gate 1:
exten => gate1,1,Log(NOTICE, [DEBUG=${ENV(DEBUG)}] Web UI triggering Gate 1 call to $GATE_1_PHONE)
exten => gate1,n,ExecIf($["${ENV(DEBUG)}" = "1" | "${ENV(DEBUG)}" = "true" | "$DEBUG" = "1"]?Wait(2))
exten => gate1,n,ExecIf($["${ENV(DEBUG)}" = "1" | "${ENV(DEBUG)}" = "true" | "$DEBUG" = "1"]?Hangup())
exten => gate1,n,Dial(SIP/sip-trunk/$GATE_1_PHONE,30)
exten => gate1,n,NoOp(Dial Status: ${DIALSTATUS})
exten => gate1,n,Hangup()

; Gate 2:
exten => gate2,1,Log(NOTICE, [DEBUG=${ENV(DEBUG)}] Web UI triggering Gate 2 call to $GATE_2_PHONE)
exten => gate2,n,ExecIf($["${ENV(DEBUG)}" = "1" | "${ENV(DEBUG)}" = "true" | "$DEBUG" = "1"]?Wait(2))
exten => gate2,n,ExecIf($["${ENV(DEBUG)}" = "1" | "${ENV(DEBUG)}" = "true" | "$DEBUG" = "1"]?Hangup())
exten => gate2,n,Dial(SIP/sip-trunk/$GATE_2_PHONE,30)
exten => gate2,n,NoOp(Dial Status: ${DIALSTATUS})
exten => gate2,n,Hangup()
