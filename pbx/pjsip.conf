[global]
type=global
user_agent=Asterisk PBX

; =====================================================================
; 1. UDP Transport Definition
; =====================================================================
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=172.16.0.0/12
local_net=10.0.0.0/8
local_net=192.168.0.0/16
$EXTERNAL_IP_CONFIG

; =====================================================================
; 2. Outbound SIP Trunk Auth (Must precede registration reference)
; =====================================================================
[sip-trunk-auth]
type=auth
auth_type=userpass
username=$SIP_TRUNK_USERNAME
password=$SIP_TRUNK_SECRET

; =====================================================================
; 3. Outbound SIP Trunk Registration Block (Injected by entrypoint)
; =====================================================================
$PJSIP_REGISTRATION_BLOCK

; =====================================================================
; 4. Outbound SIP Trunk Definition (Viptel)
; =====================================================================
[sip-trunk-aor]
type=aor
contact=sip:$SIP_TRUNK_HOST
default_expiration=120
qualify_frequency=60
qualify_timeout=3.0

[sip-trunk]
type=endpoint
context=incoming
transport=transport-udp
disallow=all
allow=alaw
allow=ulaw
allow=gsm
outbound_auth=sip-trunk-auth
aors=sip-trunk
from_user=$SIP_TRUNK_USERNAME
from_domain=$SIP_TRUNK_HOST
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[sip-trunk-identify]
type=identify
endpoint=sip-trunk
match=$SIP_TRUNK_HOST

; =====================================================================
; 5. Internal Softphone Extensions (1000 & 1001)
; =====================================================================

; --- Extension 1000 ---
[1000-auth]
type=auth
auth_type=userpass
username=stoffer
password=EizaH6ae

[1000-aor]
type=aor
max_contacts=1

[1000]
type=endpoint
context=myphones
transport=transport-udp
disallow=all
allow=alaw
allow=ulaw
allow=gsm
auth=1000-auth
aors=1000
callerid="First Phone" <1000>
direct_media=no
dtmf_mode=rfc4733

