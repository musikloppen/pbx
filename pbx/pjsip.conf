[global]
type=global
user_agent=Asterisk PBX

; --- 1. UDP Transport ---
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=172.16.0.0/12
local_net=10.0.0.0/8
local_net=192.168.0.0/16
external_media_address=193.89.248.25
external_signaling_address=193.89.248.25

; --- 2. Outbound SIP Trunk Registration ---
$PJSIP_REGISTRATION_BLOCK

; --- 3. SIP Trunk Definition ---
[sip-trunk-auth]
type=auth
auth_type=userpass
username=$SIP_TRUNK_USERNAME
password=$SIP_TRUNK_SECRET

[sip-trunk-aor]
type=aor
contact=sip:$SIP_TRUNK_HOST

[sip-trunk]
type=endpoint
context=incoming
transport=transport-udp
disallow=all
allow=alaw
allow=ulaw
allow=gsm
outbound_auth=sip-trunk-auth
aors=sip-trunk
from_user=$SIP_TRUNK_USERNAME
from_domain=$SIP_TRUNK_HOST
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[sip-trunk-identify]
type=identify
endpoint=sip-trunk
match=$SIP_TRUNK_HOST

; --- 4. Internal Phones (1000 & 1001) ---

; Extension 1000
