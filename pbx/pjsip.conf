type=auth
auth_type=userpass
username=stoffer
password=EizaH6ae

[1000-aor]
type=aor
max_contacts=1

[1000]
type=endpoint
context=myphones
transport=transport-udp
disallow=all
allow=alaw
allow=ulaw
allow=gsm
auth=1000-auth
